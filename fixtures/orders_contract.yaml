version: "1.0"
name: "orders"
description: "Orders CSV after repair — required for DataContractGate gate before return"

ontology:
  entities:
    - name: order_id
      type: string
      required: true
      min_length: 1
    - name: sku
      type: string
      required: true
    - name: qty
      type: integer
      required: true
      min: 0
    - name: amount
      type: float
      required: true
      min: 0
    - name: status
      type: string
      required: true
      enum: ["pending", "shipped", "completed", "cancelled"]
