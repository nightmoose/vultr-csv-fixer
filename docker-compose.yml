# Control plane + throwaway sandbox image.
# For an Ubuntu Vultr Cloud Compute VM that already has Docker Engine.
#
#   cp .env.example .env
#   # set VULTR_INFERENCE_API_KEY and leave MOCK_LLM=0 for live inference
#   docker compose up -d --build
#
# The API container uses the host Docker socket to run one sandbox per attempt.
# Job files sit on a bind mount so the host daemon sees the same paths the
# container writes. Sandboxes do not receive the socket, the API key, or a network.

name: csv-fixer

services:
  sandbox:
    build:
      context: ./sandbox_worker
      dockerfile: Dockerfile
    image: ${SANDBOX_IMAGE:-csv-fixer-sandbox:local}
    entrypoint: ["python", "-c", "print('csv-fixer sandbox image is ready')"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: csv-fixer-api:local
    restart: unless-stopped
    init: true
    depends_on:
      sandbox:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Explicit so a missing .env key still has a safe default.
      # These override env_file. Compose interpolates them from .env.
      MOCK_LLM: ${MOCK_LLM:-0}
      FORCE_MOCK_SANDBOX: ${FORCE_MOCK_SANDBOX:-0}
      VULTR_INFERENCE_API_KEY: ${VULTR_INFERENCE_API_KEY:-}
      VULTR_INFERENCE_BASE_URL: ${VULTR_INFERENCE_BASE_URL:-https://api.vultrinference.com/v1}
      VULTR_INFERENCE_MODEL: ${VULTR_INFERENCE_MODEL:-glm-5.3-flash}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-csv-fixer-sandbox:local}
      SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-30}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-512m}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      MAX_AGENT_RETRIES: ${MAX_AGENT_RETRIES:-3}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000}
      # Same path on the host and in this container. The host daemon
      # bind-mounts this path into each sandbox; a container-only /tmp does not.
      JOBS_DIR: ${HOST_DATA_DIR:-/var/lib/csvfix-work}/jobs
      ARTIFACTS_DIR: ${HOST_DATA_DIR:-/var/lib/csvfix-work}/artifacts
      HOST_JOBS_DIR: ${HOST_DATA_DIR:-/var/lib/csvfix-work}/jobs
      TMPDIR: ${HOST_DATA_DIR:-/var/lib/csvfix-work}/tmp
      DEFAULT_CONTRACT: /app/fixtures/orders_contract.yaml
    volumes:
      # docker.sock is mounted only here. It is not published as a port.
      - ${HOST_DATA_DIR:-/var/lib/csvfix-work}:${HOST_DATA_DIR:-/var/lib/csvfix-work}
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
