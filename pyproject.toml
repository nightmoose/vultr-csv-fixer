[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vultr-csv-fixer"
version = "0.2.0"
description = "Sandboxed CSV fixer: agent writes repair code, runs in throwaway Docker, DataContractGate validates before return."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nightmoose" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.25",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "contractgate>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
csv-fixer = "csv_fixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csv_fixer = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
